name: honeyforge

services:
  pki-init:
    build:
      context: .
    entrypoint: ["python", "-m", "scripts.init_pki"]
    command: []
    environment:
      PKI_DIR: /pki
      PKI_PUBLIC_DIR: /pki-public
      AGENT_BOOTSTRAP_DIR: /agent-bootstrap
      PKI_SERVER_NAME: ${PKI_SERVER_NAME:-agent-gateway}
      PKI_CA_COMMON_NAME: ${PKI_CA_COMMON_NAME:-Local Service CA}
    volumes:
      - ./secrets/pki:/pki
      - ./secrets/pki-public:/pki-public
      - ./secrets/agent:/agent-bootstrap
    restart: "no"

  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honeyforge}
      POSTGRES_USER: ${POSTGRES_USER:-honeyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-honeyforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-honeyforge}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: local
      CA_CERT_PATH: /run/honeyforge-pki/ca.crt
      CA_KEY_PATH: /run/honeyforge-pki/ca.key
      AGENT_GATEWAY_PEER_NAME: agent-gateway
    depends_on:
      pki-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./secrets/pki/ca.crt:/run/honeyforge-pki/ca.crt:ro
      - ./secrets/pki/ca.key:/run/honeyforge-pki/ca.key:ro
      - ./secrets/agent:/run/honeyforge-bootstrap
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [edge, data, agent_backend]

  nginx:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [edge]

  agent-gateway:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    environment:
      AGENT_TRANSPORT_PREFIX: ${AGENT_TRANSPORT_PREFIX:-/assets/runtime}
      AGENT_TLS_SERVER_NAME: ${PKI_SERVER_NAME:-agent-gateway}
    ports:
      - "${AGENT_BIND_IP:-127.0.0.1}:${AGENT_PORT:-8443}:8443"
    volumes:
      - ./docker/agent-gateway.conf:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/pki/server.crt:/etc/nginx/pki/server.crt:ro
      - ./secrets/pki/server.key:/etc/nginx/pki/server.key:ro
      - ./secrets/pki/ca.crt:/etc/nginx/pki/ca.crt:ro
    depends_on:
      pki-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/internal-health"]
      interval: 10s
      timeout: 4s
      retries: 8
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    networks: [agent_ingress, agent_backend, agent_channel]

  test-db:
    profiles: ["test"]
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: honeyforge_test
      POSTGRES_USER: honeyforge_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyforge_test -d honeyforge_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [test_data]

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://honeyforge_test:${POSTGRES_PASSWORD}@test-db:5432/honeyforge_test
      TEST_DATABASE_URL: postgresql+psycopg://honeyforge_test:${POSTGRES_PASSWORD}@test-db:5432/honeyforge_test
      TEST_DATABASE_CONFIRMATION: honeyforge_test
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: test
    depends_on:
      test-db:
        condition: service_healthy
    networks: [test_data]

volumes:
  postgres_data:
  postgres_test_data:

networks:
  edge:
  agent_ingress:
  agent_backend:
    internal: true
  data:
    internal: true
  agent_channel:
    internal: true
  test_data:
    internal: true
