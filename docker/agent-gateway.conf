server {
    listen 8443 ssl;
    server_name ${AGENT_TLS_SERVER_NAME};
    server_tokens off;

    ssl_certificate /etc/nginx/pki/server.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;
    ssl_client_certificate /etc/nginx/pki/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 600k;
    proxy_intercept_errors on;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-HoneyForge-Gateway;
    proxy_hide_header X-HoneyForge-Client-Verify;
    proxy_hide_header X-HoneyForge-Client-Cert;

    # Collapse public client, upstream and TLS errors to one ordinary web response.
    # Agents use status success/failure only; no protocol operation depends on these bodies.
    error_page 400 401 403 404 405 408 409 410 411 412 413 414 415 416 417 421 422 425 426 428 429 431 494 495 496 497 500 501 502 503 504 505 507 508 510 511 =404 @neutral_not_found;

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Service</title></head><body></body></html>';
    }

    # Compatibility route used by all currently enrolled agents.
    location = /agent/v1/enroll {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-HoneyForge-Gateway agent-gateway;
        proxy_set_header X-HoneyForge-Client-Verify $ssl_client_verify;
        proxy_set_header X-HoneyForge-Client-Cert $ssl_client_escaped_cert;
    }

    location /agent/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 496; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-HoneyForge-Gateway agent-gateway;
        proxy_set_header X-HoneyForge-Client-Verify $ssl_client_verify;
        proxy_set_header X-HoneyForge-Client-Cert $ssl_client_escaped_cert;
    }

    # Optional neutral transport alias. It rewrites only at the gateway;
    # FastAPI continues to expose the existing internal /agent/v1 contract.
    location = ${AGENT_TRANSPORT_PREFIX}/v1/enroll {
        proxy_pass http://api:8000/agent/v1/enroll;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-HoneyForge-Gateway agent-gateway;
        proxy_set_header X-HoneyForge-Client-Verify $ssl_client_verify;
        proxy_set_header X-HoneyForge-Client-Cert $ssl_client_escaped_cert;
    }

    location ${AGENT_TRANSPORT_PREFIX}/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 496; }
        proxy_pass http://api:8000/agent/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-HoneyForge-Gateway agent-gateway;
        proxy_set_header X-HoneyForge-Client-Verify $ssl_client_verify;
        proxy_set_header X-HoneyForge-Client-Cert $ssl_client_escaped_cert;
    }

    location @neutral_not_found {
        internal;
        default_type text/html;
        return 404 '<!doctype html><html><head><title>Not Found</title></head><body></body></html>';
    }

    location / { return 404; }
}

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;

    location = /internal-health {
        default_type text/plain;
        return 200 'ok';
    }

    location / { return 404; }
}
